[env_common_esp32rx]
extends = env_common_esp32
monitor_speed = 420000
build_flags =
	${env_common_esp32.build_flags}
	${common_env_data.build_flags_rx}
	-include target/Unified_ESP_RX.h
build_src_filter = ${env_common_esp32.build_src_filter} -<tx_*.cpp> -<tx-*/>

[env:Unified_ESP32_2400_RX_via_UART]
extends = env_common_esp32rx, radio_SX128X
build_flags =
	${env_common_esp32rx.build_flags}
	${radio_SX128X.build_flags}

[env:Unified_ESP32_2400_RX_via_BetaflightPassthrough]
extends = env:Unified_ESP32_2400_RX_via_UART

[env:Unified_ESP32_2400_RX_via_WIFI]
extends = env:Unified_ESP32_2400_RX_via_UART

[env:ROBOTIS_2400_RX_via_UART]
extends = env:Unified_ESP32_2400_RX_via_UART
board_config = targets/robotis-bic37-a01-e001.json

[env:ROBOTIS_2400_RX_via_BetaflightPassthrough]
extends = env:ROBOTIS_2400_RX_via_UART

[env:ROBOTIS_2400_RX_via_WIFI]
extends = env:ROBOTIS_2400_RX_via_UART

[env:ROBOTIS_2400_RX_CE_via_UART]
extends = env:ROBOTIS_2400_RX_via_UART
build_flags =
	${env:ROBOTIS_2400_RX_via_UART.build_flags}
	!-DRegulatory_Domain_ISM_2400
	-DRegulatory_Domain_EU_CE_2400
	-DREGULATORY_MAX_POWER_LEVEL=2

[env:ROBOTIS_2400_RX_CE_CERT_TEST_via_UART]
extends = env:ROBOTIS_2400_RX_CE_via_UART
build_flags =
	${env:ROBOTIS_2400_RX_CE_via_UART.build_flags}
	-DREGULATORY_CERT_TEST=1

[env:ROBOTIS_2400_RX_FCC_via_UART]
extends = env:ROBOTIS_2400_RX_via_UART
build_flags =
	${env:ROBOTIS_2400_RX_via_UART.build_flags}
	!-DRegulatory_Domain_EU_CE_2400
	-DRegulatory_Domain_ISM_2400
	-DREGULATORY_REGION_FCC=1

[env:ROBOTIS_2400_RX_FCC_CERT_TEST_via_UART]
extends = env:ROBOTIS_2400_RX_FCC_via_UART
build_flags =
	${env:ROBOTIS_2400_RX_FCC_via_UART.build_flags}
	-DREGULATORY_CERT_TEST=1

[env:ROBOTIS_2400_RX_KC_CANDIDATE_via_UART]
extends = env:ROBOTIS_2400_RX_via_UART
build_flags =
	${env:ROBOTIS_2400_RX_via_UART.build_flags}
	!-DRegulatory_Domain_EU_CE_2400
	-DRegulatory_Domain_ISM_2400
	-DREGULATORY_REGION_KC=1
	-DREGULATORY_MAX_POWER_LEVEL=0

[env:ROBOTIS_2400_RX_KC_CERT_TEST_via_UART]
extends = env:ROBOTIS_2400_RX_KC_CANDIDATE_via_UART
build_flags =
	${env:ROBOTIS_2400_RX_KC_CANDIDATE_via_UART.build_flags}
	-DREGULATORY_CERT_TEST=1

[env:ROBOTIS_2400_RX_JP_GITEKI_CANDIDATE_via_UART]
extends = env:ROBOTIS_2400_RX_via_UART
build_flags =
	${env:ROBOTIS_2400_RX_via_UART.build_flags}
	!-DRegulatory_Domain_EU_CE_2400
	-DRegulatory_Domain_ISM_2400
	-DREGULATORY_REGION_JP_GITEKI=1
	-DREGULATORY_MAX_POWER_LEVEL=0

[env:ROBOTIS_2400_RX_JP_GITEKI_CERT_TEST_via_UART]
extends = env:ROBOTIS_2400_RX_JP_GITEKI_CANDIDATE_via_UART
build_flags =
	${env:ROBOTIS_2400_RX_JP_GITEKI_CANDIDATE_via_UART.build_flags}
	-DREGULATORY_CERT_TEST=1

; Backwards-compatible name used before the regulatory build matrix was added.
[env:ROBOTIS_2400_RX_EU_CE_via_UART]
extends = env:ROBOTIS_2400_RX_CE_via_UART

[env:ROBOTIS_2400_RX_EU_CE_via_BetaflightPassthrough]
extends = env:ROBOTIS_2400_RX_EU_CE_via_UART

[env:ROBOTIS_2400_RX_EU_CE_via_WIFI]
extends = env:ROBOTIS_2400_RX_EU_CE_via_UART



[env:Unified_ESP32_900_RX_via_UART]
extends = env_common_esp32rx, radio_SX127X
build_flags =
	${env_common_esp32rx.build_flags}
	${radio_SX127X.build_flags}

[env:Unified_ESP32_900_RX_via_BetaflightPassthrough]
extends = env:Unified_ESP32_900_RX_via_UART

[env:Unified_ESP32_900_RX_via_WIFI]
extends = env:Unified_ESP32_900_RX_via_UART

[env:Unified_ESP32_LR1121_RX_via_UART]
extends = env_common_esp32rx, radio_LR1121
build_flags =
	${env_common_esp32rx.build_flags}
	${radio_LR1121.build_flags}

[env:Unified_ESP32_LR1121_RX_via_BetaflightPassthrough]
extends = env:Unified_ESP32_LR1121_RX_via_UART

[env:Unified_ESP32_LR1121_RX_via_WIFI]
extends = env:Unified_ESP32_LR1121_RX_via_UART
